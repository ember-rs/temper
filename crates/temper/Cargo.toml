[package]
name = "temper"
description = "The temper binary: wires ingot, bellows, and ember together."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "temper"
path = "src/main.rs"

[dependencies]
ingot.workspace = true
bellows.workspace = true
ember.workspace = true

[dev-dependencies]
ember = { workspace = true, features = ["test-support"] }
tokio = { workspace = true, features = ["macros", "rt"] }

[package.metadata.cargo-machete]
# Scaffold: compile-checked only. Remove each entry once it is actually used.
ignored = ["bellows", "ember"]

[lints]
workspace = true
